name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - ci-test   # ✅ 新增自动测试分支
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: docker-builder-server
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "${{ secrets.GHCR_PROD_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          else
            echo "${{ secrets.GHCR_TEST_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          fi

      - name: Build and Push Docker Image
        run: |
          docker build -t ghcr.io/xk4bj/mindpost:${{ github.ref_name }}-${{ github.sha }} .
          docker push ghcr.io/xk4bj/mindpost:${{ github.ref_name }}-${{ github.sha }}

  production-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: prod-server
    steps:
      - name: Set COMMIT_SHA environment variable
        run: echo "COMMIT_SHA=${{ github.sha }}" >> $GITHUB_ENV

      - name: Deploy to Production
        run: |
          docker-compose -f docker-compose.prod.yml pull
          docker-compose -f docker-compose.prod.yml up -d

  auto-test-deploy:  # ✅ 新增自动测试部署 Job
    if: github.event_name == 'push' && github.ref == 'refs/heads/ci-test'
    runs-on: test-server
    steps:
      - name: Set COMMIT_SHA environment variable
        run: echo "COMMIT_SHA=${{ github.sha }}" >> $GITHUB_ENV

      - name: Deploy to CI Test Environment
        run: |
          docker-compose -f docker-compose.citest.yml pull
          docker-compose -f docker-compose.citest.yml up -d

      - name: Wait for service to be ready
        run: sleep 15  # 视项目情况调整等待时间
